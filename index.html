<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e31837">
<title>7-Eyes | Camera Scan Test V2</title>
<style>
:root{--red:#e31837;--ink:#202124;--muted:#687078;--line:#e4e7eb}
*{box-sizing:border-box}body{margin:0;background:#f4f5f6;color:var(--ink);font:16px Arial,sans-serif}
header{background:var(--red);color:white;padding:15px 17px}header b{font-size:19px}header small{display:block;margin-top:4px}
main{max-width:680px;margin:auto;padding:13px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
#reader{width:100%;overflow:hidden;border-radius:11px;background:#111;min-height:230px}
#reader video{object-fit:cover}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button,select{font:inherit;border-radius:10px;min-height:44px;padding:9px 12px}
button{border:0;font-weight:700;background:#eceff1;color:#202124;flex:1}
button.primary{background:var(--red);color:#fff}button:disabled{opacity:.4}
select{width:100%;border:1px solid var(--line);background:white}
label{display:block;color:var(--muted);font-size:13px;margin:0 0 7px}
#status{font-size:13px;color:var(--muted);line-height:1.5;margin-top:9px;min-height:18px}
#last{font-size:26px;font-weight:bold;overflow-wrap:anywhere;margin:6px 0}
#last.empty{font-size:16px;font-weight:normal;color:#9aa0a6}
input[type=range]{width:100%}
.small{font-size:12px;color:var(--muted);line-height:1.5}
ul{padding:0;margin:7px 0;list-style:none}li{border-top:1px solid var(--line);padding:9px 0;display:flex;justify-content:space-between;gap:8px;font-size:14px}li code{font-weight:bold;overflow-wrap:anywhere}li small{white-space:nowrap;color:var(--muted)}
#zoomRow{display:none}
</style>
</head>
<body>
<header><b>7-Eyes | Camera Scan Test V2</b><small>Thử nghiệm tối ưu quét barcode sản phẩm · Chưa kết nối HSD</small></header>
<main>
<section class="card">
<label for="camera">Camera</label><select id="camera"><option value="">Tự động chọn camera sau</option></select>
<div id="reader"></div>
<div class="row">
<button id="start" class="primary">Mở camera</button>
<button id="stop" disabled>Tắt camera</button>
</div>
<div class="row">
<button id="torch" disabled>🔦 Bật đèn flash</button>
<button id="refocus" disabled>Lấy nét lại</button>
</div>
<div id="zoomRow">
<label for="zoom">Zoom camera: <span id="zoomValue">1.0x</span></label>
<input id="zoom" type="range" min="1" max="1" step="0.1" value="1">
</div>
<div id="status" role="status">Chưa mở camera.</div>
</section>
<section class="card">
<label>Barcode mới nhất</label><div id="last" class="empty">Chưa có mã</div>
<div class="row"><button id="copy" disabled>Sao chép</button><button id="clear">Xóa kết quả</button></div>
</section>
<section class="card">
<label>Lịch sử quét trong phiên</label><ul id="history"><li class="small">Chưa có dữ liệu.</li></ul>
<p class="small">V2 chỉ bật các định dạng barcode sản phẩm 1D phổ biến. Thử nghiệm flash/zoom phụ thuộc khả năng camera và trình duyệt. Mã chỉ lưu trong phiên trang hiện tại.</p>
</section>
</main>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(() => {
 const $=id=>document.getElementById(id);
 const formats=[
  Html5QrcodeSupportedFormats.EAN_13,
  Html5QrcodeSupportedFormats.EAN_8,
  Html5QrcodeSupportedFormats.UPC_A,
  Html5QrcodeSupportedFormats.UPC_E,
  Html5QrcodeSupportedFormats.CODE_128,
  Html5QrcodeSupportedFormats.ITF
 ];
 const scanner=new Html5Qrcode("reader",{verbose:false,formatsToSupport:formats});
 let running=false, latest="", lastMap=new Map(), torchOn=false, track=null;
 const status=t=>$("status").textContent=t;
 function addCode(code){
  const now=Date.now();
  if(!code || (lastMap.has(code)&&now-lastMap.get(code)<1400)) return;
  lastMap.set(code,now); latest=code;
  $("last").textContent=code;$("last").classList.remove("empty");$("copy").disabled=false;
  if($("history").querySelector(".small")) $("history").innerHTML="";
  const li=document.createElement("li"), c=document.createElement("code"), tm=document.createElement("small");
  c.textContent=code;tm.textContent=new Date().toLocaleTimeString("vi-VN");li.append(c,tm);$("history").prepend(li);
  status("Đã nhận mã. Đưa barcode tiếp theo vào vùng quét.");
  if(navigator.vibrate) navigator.vibrate(45);
 }
 async function listCameras(){
  try{
   const list=await Html5Qrcode.getCameras();
   $("camera").innerHTML="";
   list.forEach((c,i)=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.label||("Camera "+(i+1));$("camera").append(o)});
   const rear=list.find(c=>/back|rear|environment|sau/i.test(c.label));
   if(rear)$("camera").value=rear.id;
   return list;
  }catch(e){status("Không lấy được danh sách camera: "+e);return []}
 }
 async function cameraInfo(){
  try{
   const caps=scanner.getRunningTrackCapabilities();
   track=scanner.getRunningTrackSettings();
   const zoom=caps.zoom;
   if(zoom){
    $("zoomRow").style.display="block";
    $("zoom").min=zoom.min??1;$("zoom").max=zoom.max??1;$("zoom").step=zoom.step??0.1;
    $("zoom").value=Math.max(zoom.min??1,Math.min(zoom.max??1,track.zoom??1));
    $("zoomValue").textContent=Number($("zoom").value).toFixed(1)+"x";
   }else $("zoomRow").style.display="none";
   $("torch").disabled=!caps.torch;
   if(!caps.torch)$("torch").textContent="Flash không hỗ trợ";
   $("refocus").disabled=false;
  }catch(e){$("torch").disabled=true;$("refocus").disabled=true}
 }
 async function start(){
  if(!window.isSecureContext){status("Cần mở trang bằng HTTPS.");return}
  if(!window.Html5Qrcode){status("Không tải được thư viện scanner. Kiểm tra Internet và tải lại.");return}
  $("start").disabled=true;status("Đang mở camera, vui lòng cấp quyền…");
  try{
   const constraints={
    facingMode:"environment",
    width:{ideal:1920},height:{ideal:1080},
    advanced:[{focusMode:"continuous"}]
   };
   const config={fps:18,qrbox:(w,h)=>({width:Math.floor(w*.92),height:Math.min(190,Math.floor(h*.42))}),aspectRatio:4/3,disableFlip:true};
   await scanner.start($("camera").value||constraints,config,decoded=>addCode(decoded),()=>{});
   running=true;$("stop").disabled=false;$("camera").disabled=true;
   status("Camera đang chạy. Căn barcode nằm ngang trong khung quét; thử bật flash hoặc zoom nếu khó đọc.");
   await cameraInfo();
  }catch(e){
   $("start").disabled=false;status("Không mở được camera: "+(e?.message||e));
  }
 }
 async function stop(){
  if(running){try{await scanner.stop()}catch(e){} running=false}
  try{await scanner.clear()}catch(e){}
  $("start").disabled=false;$("stop").disabled=true;$("camera").disabled=false;
  $("torch").disabled=true;$("refocus").disabled=true;$("zoomRow").style.display="none";torchOn=false;
  $("torch").textContent="🔦 Bật đèn flash";status("Đã tắt camera.");
 }
 $("start").onclick=start;$("stop").onclick=stop;
 $("camera").onchange=()=>{if(running){stop().then(start)}};
 $("torch").onclick=async()=>{
  try{torchOn=!torchOn;await scanner.applyVideoConstraints({advanced:[{torch:torchOn}]});$("torch").textContent=torchOn?"Tắt đèn flash":"🔦 Bật đèn flash";status(torchOn?"Đã bật flash.":"Đã tắt flash.")}
  catch(e){torchOn=false;status("Không bật được flash trên camera này.")}
 };
 $("zoom").oninput=async()=>{
  const z=Number($("zoom").value);$("zoomValue").textContent=z.toFixed(1)+"x";
  try{await scanner.applyVideoConstraints({advanced:[{zoom:z}]})}catch(e){status("Camera không áp dụng được mức zoom này.")}
 };
 $("refocus").onclick=async()=>{
  try{await scanner.applyVideoConstraints({advanced:[{focusMode:"continuous"}]});status("Đã yêu cầu camera lấy nét liên tục. Hãy di chuyển điện thoại nhẹ để camera bắt nét lại.")}
  catch(e){status("Thiết bị không cho phép điều khiển lấy nét từ trình duyệt; thử đưa máy ra xa/gần nhẹ để camera tự lấy nét.")}
 };
 $("copy").onclick=async()=>{try{await navigator.clipboard.writeText(latest);status("Đã sao chép mã.")}catch(e){status("Không thể sao chép trên trình duyệt này.")}};
 $("clear").onclick=()=>{latest="";lastMap.clear();$("last").textContent="Chưa có mã";$("last").classList.add("empty");$("copy").disabled=true;$("history").innerHTML='<li class="small">Chưa có dữ liệu.</li>';status("Đã xóa kết quả.")};
 listCameras();
 window.addEventListener("pagehide",()=>{if(running)scanner.stop().catch(()=>{})});
})();
</script>
</body></html>
